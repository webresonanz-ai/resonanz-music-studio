<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Resonanz Music Studio</title>

    <meta
      name="description"
      content="Find your passion for music at The Resonanz Music Studio. Explore our programs, meet our teachers, and start your musical journey today."
    />
    <meta name="robots" content="index, follow" />

    <link rel="icon" href="/logo_resonanz.webp" />
    <link rel="canonical" href="https://trms.resonanz.id/" />

    <!-- Preconnect hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical assets -->
    <link rel="preload" href="/logo_resonanz.webp" as="image" />

    <!-- Open Graph -->
    <meta property="og:title" content="The Resonanz Music Studio" />
    <meta
      property="og:description"
      content="Find your passion for music at The Resonanz Music Studio. Explore our programs, meet our teachers, and start your musical journey today."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trms.resonanz.id/" />
    <meta property="og:image" content="https://trms.resonanz.id/logo_resonanz.webp" />

    <!-- Google Fonts — preload + swap for CLS prevention & early discovery -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "The Resonanz Music Studio",
        "url": "https://trms.resonanz.id"
      }
    </script>
  </head>

  <body>
    <div id="app">
      <div id="app-loading">
        <div class="app-loading__inner">
          <img src="/logo_resonanz.webp" alt="Loading..." class="app-loading__logo" width="72" height="72" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>

    <style>
      #app-loading {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #0a0a12;
      }
      .app-loading__inner { text-align: center; }
      .app-loading__logo {
        width: 72px; height: auto;
        opacity: 0;
        animation: al-fade 0.7s ease 0.15s forwards;
        filter: drop-shadow(0 0 24px rgba(200, 164, 93, 0.12));
      }
      @keyframes al-fade { to { opacity: 1; } }
    </style>
  </body>
</html>
